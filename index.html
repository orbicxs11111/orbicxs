<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbicXs Browser</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Arial, sans-serif;
            background: #0f0f0f;
            color: #fff;
            height: 100vh;
            overflow: hidden;
        }
        .browser {
            width: 100%;
            height: 100vh;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.8);
        }
        .title-bar {
            background: linear-gradient(to right, #0a84ff, #0055cc);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: bold;
        }
        .logo { font-size: 24px; color: #fff; }
        .toolbar {
            background: #2d2d2d;
            padding: 12px;
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .nav-btn {
            width: 38px;
            height: 38px;
            background: #444;
            border: none;
            color: white;
            font-size: 20px;
            border-radius: 50%;
            cursor: pointer;
        }
        .url-bar {
            flex: 1;
            padding: 12px 18px;
            background: #1f1f1f;
            border: 1px solid #555;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
        }
        .go-btn {
            padding: 12px 24px;
            background: #0a84ff;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .iframe-container {
            flex: 1;
            background: #fff;
            position: relative;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="browser">
    <!-- Title Bar -->
    <div class="title-bar">
        <div class="logo">OrbicXs</div>
        <div>OrbicXs Browser</div>
        <div>● ● ●</div>
    </div>

    <!-- Toolbar -->
    <div class="toolbar">
        <button class="nav-btn" onclick="goBack()">←</button>
        <button class="nav-btn" onclick="goForward()">→</button>
        <button class="nav-btn" onclick="reloadPage()">↻</button>

        <input type="text" id="urlInput" class="url-bar" 
               value="https://www.google.com" 
               placeholder="Qidirish yoki URL kiriting..."
               onkeypress="if(event.key === 'Enter') loadUrl()">

        <button class="go-btn" onclick="loadUrl()">Go</button>
    </div>

    <!-- Brauzer maydoni -->
    <div class="iframe-container">
        <iframe id="webview" is="x-frame-bypass" src="https://www.google.com"></iframe>
    </div>
</div>

<!-- X-Frame-Bypass kutubxonasi (muhim qism!) -->
<script src="https://unpkg.com/@ungap/custom-elements-builtin"></script>
<script type="module" src="https://unpkg.com/x-frame-bypass"></script>

<script>
    const iframe = document.getElementById('webview');
    const urlInput = document.getElementById('urlInput');

    function loadUrl() {
        let url = urlInput.value.trim();
        if (!url) return;

        if (!url.startsWith('http://') && !url.startsWith('https://')) {
            url = 'https://' + url;
        }
        iframe.src = url;
    }

    function reloadPage() {
        iframe.contentWindow.location.reload();
    }

    function goBack() {
        try { iframe.contentWindow.history.back(); } catch(e) { alert("Orqaga qaytish bloklangan"); }
    }

    function goForward() {
        try { iframe.contentWindow.history.forward(); } catch(e) {}
    }

    // URL ni avto yangilash
    iframe.onload = function() {
        try {
            urlInput.value = iframe.contentWindow.location.href;
        } catch(e) {}
    };
</script>

</body>
</html>
