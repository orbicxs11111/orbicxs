<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbicXs Browser</title>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background: #0a0a0a;
            height: 100vh;
            overflow: hidden;
            color: #fff;
        }
        .browser {
            width: 100%; height: 100vh;
            background: #1e1e1e;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 40px rgba(0,0,0,0.9);
        }
        .title-bar {
            background: linear-gradient(90deg, #0a84ff, #0055cc);
            padding: 10px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            font-weight: 600;
            font-size: 18px;
        }
        .logo { font-size: 28px; font-weight: bold; }

        .toolbar {
            background: #252525;
            padding: 10px 12px;
            display: flex;
            align-items: center;
            gap: 10px;
            flex-wrap: wrap;
        }
        .nav-btn {
            width: 42px; height: 42px;
            background: #3a3a3a;
            border: none;
            color: #fff;
            font-size: 24px;
            border-radius: 50%;
            cursor: pointer;
        }
        .url-bar, .search-bar {
            padding: 12px 18px;
            background: #1f1f1f;
            border: 1px solid #555;
            border-radius: 30px;
            color: #fff;
            font-size: 16px;
        }
        .url-bar { flex: 2; min-width: 320px; }
        .search-bar { flex: 1; min-width: 250px; }
        .btn {
            padding: 12px 24px;
            background: #0a84ff;
            color: white;
            border: none;
            border-radius: 30px;
            cursor: pointer;
            font-weight: bold;
        }
        .iframe-container {
            flex: 1;
            background: #fff;
        }
        iframe {
            width: 100%;
            height: 100%;
            border: none;
        }
    </style>
</head>
<body>

<div class="browser">
    <div class="title-bar">
        <div class="logo">OrbicXs</div>
        <div>OrbicXs Browser</div>
        <div>● ● ●</div>
    </div>

    <div class="toolbar">
        <button class="nav-btn" onclick="goBack()">←</button>
        <button class="nav-btn" onclick="goForward()">→</button>
        <button class="nav-btn" onclick="reloadPage()">↻</button>

        <input type="text" id="urlInput" class="url-bar" 
               value="https://www.google.com" 
               placeholder="URL kiriting..." 
               onkeypress="if(event.key==='Enter') loadUrl()">

        <button class="btn" onclick="loadUrl()">Go</button>

        <!-- Qidirish maydoni - Google kabi -->
        <input type="text" id="searchInput" class="search-bar" 
               placeholder="Toshkent kitob, ob-havo yoki istalgan narsani yozing..." 
               onkeypress="if(event.key==='Enter') searchGoogle()">
        <button class="btn" onclick="searchGoogle()">Google'da qidirish</button>
    </div>

    <div class="iframe-container">
        <iframe id="webview" src="https://www.google.com"></iframe>
    </div>
</div>

<script>
    const iframe = document.getElementById('webview');
    const urlInput = document.getElementById('urlInput');
    const searchInput = document.getElementById('searchInput');

    // Bir nechta proxy (hozirgi paytda eng yaxshilari)
    const proxies = [
        '', 
        'https://api.allorigins.win/raw?url=',
        'https://corsproxy.io/?url='
    ];
    let proxyIndex = 0;

    function tryLoad(url) {
        if (proxyIndex >= proxies.length) {
            iframe.src = url;
            return;
        }
        const proxy = proxies[proxyIndex];
        iframe.src = proxy ? proxy + encodeURIComponent(url) : url;
        proxyIndex++;
    }

    function loadUrl() {
        let url = urlInput.value.trim();
        if (!url) return;
        if (!url.startsWith('http')) url = 'https://' + url;
        proxyIndex = 0;
        tryLoad(url);
    }

    // Asosiy funksiya: Google orqali qidirish
    function searchGoogle() {
        let query = searchInput.value.trim();
        if (!query) return;

        const googleSearchUrl = `https://www.google.com/search?q=${encodeURIComponent(query)}`;
        
        urlInput.value = googleSearchUrl;
        proxyIndex = 0;
        tryLoad(googleSearchUrl);
    }

    function reloadPage() { 
        iframe.contentWindow.location.reload(); 
    }
    function goBack() { 
        try { iframe.contentWindow.history.back(); } catch(e) { alert("Orqaga qaytish bloklangan"); }
    }
    function goForward() { 
        try { iframe.contentWindow.history.forward(); } catch(e) {} 
    }

    // URL ni yangilab turish
    iframe.onload = function() {
        try {
            const current = iframe.contentWindow.location.href;
            if (!current.includes('allorigins') && !current.includes('corsproxy')) {
                urlInput.value = current;
            }
        } catch(e) {}
    };

    console.log("%cOrbicXs Browser yuklandi. Qidirish Google orqali ishlaydi!", "color:#0a84ff; font-size:16px;");
</script>

</body>
</html>
