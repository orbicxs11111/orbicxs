<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OrbicXs Browser</title>
    <style>
        /* Oldingi stillar bir xil qoldi... (joy tejash uchun qisqartirdim) */
        body { font-family: Arial, sans-serif; background: #111; margin:0; height:100vh; overflow:hidden; color:#fff; }
        .browser-window { width:100%; height:100vh; background:#1e1e1e; display:flex; flex-direction:column; box-shadow:0 0 20px rgba(0,0,0,0.9); }
        .title-bar { background:#0a84ff; padding:8px 12px; display:flex; align-items:center; justify-content:space-between; }
        .toolbar { background:#333; padding:10px; display:flex; gap:10px; align-items:center; }
        .url-bar { flex:1; padding:10px; border-radius:30px; border:none; background:#222; color:white; }
        iframe { flex:1; border:none; background:white; }
    </style>
</head>
<body>

<div class="browser-window">
    <div class="title-bar">
        <strong>OrbicXs</strong>
        <span>OrbicXs Browser</span>
        <div>● ● ●</div>
    </div>
    <div class="toolbar">
        <button onclick="historyBack()">←</button>
        <button onclick="historyForward()">→</button>
        <button onclick="reload()">↻</button>
        <input type="text" id="url" class="url-bar" value="https://www.example.com" onkeypress="if(event.key==='Enter') go()">
        <button onclick="go()">Go</button>
    </div>
    <iframe id="frame" src="https://www.example.com"></iframe>
</div>

<script>
    const frame = document.getElementById('frame');
    const urlInput = document.getElementById('url');

    function go() {
        let url = urlInput.value.trim();
        if (!url) return;
        if (!url.startsWith('http')) url = 'https://' + url;
        frame.src = url;
    }

    function reload() { frame.contentWindow.location.reload(); }
    function historyBack() { try { frame.contentWindow.history.back(); } catch(e){ alert("Back is blocked by the site"); } }
    function historyForward() { try { frame.contentWindow.history.forward(); } catch(e){} }

    // URL ni avtomatik yangilab turish
    frame.onload = () => {
        try {
            urlInput.value = frame.contentWindow.location.href;
        } catch(e) {}
    };
</script>
</body>
</html>
