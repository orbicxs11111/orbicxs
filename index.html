<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Orbicxs Home</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0; padding: 0; height: 100vh;
            background: linear-gradient(135deg, #0a0a0a 0%, #1a0033 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex; flex-direction: column; align-items: center;
            justify-content: center; color: white; overflow: hidden;
        }
        .container { text-align: center; width: 100%; max-width: 800px; padding: 20px; }
        .logo {
            font-size: 5rem; font-weight: 900; color: #00ccff;
            margin-bottom: 5px; text-shadow: 0 0 30px rgba(0, 204, 255, 0.5);
            letter-spacing: -2px;
        }
        .tagline { font-size: 1.2rem; margin-bottom: 40px; opacity: 0.7; letter-spacing: 1px; }
        
        .search-container { position: relative; width: 100%; max-width: 600px; margin: 0 auto; }
        .search-box {
            width: 100%; padding: 20px 30px; font-size: 1.2rem;
            border: none; border-radius: 50px; outline: none;
            background: rgba(255, 255, 255, 0.95); color: #333;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            transition: all 0.3s ease;
        }
        .search-box:focus { transform: scale(1.02); box-shadow: 0 0 20px rgba(0, 204, 255, 0.4); }

        .currency-container {
            margin-top: 50px; display: flex; gap: 20px;
            justify-content: center; background: rgba(255, 255, 255, 0.05);
            padding: 15px 30px; border-radius: 15px; border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .currency-item { text-align: center; }
        .currency-label { font-size: 0.8rem; opacity: 0.6; display: block; margin-bottom: 5px; }
        .currency-value { font-size: 1.1rem; font-weight: bold; color: #00ccff; }
    </style>
</head>
<body>

    <div class="container">
        <div class="logo">Orbicxs</div>
        <p class="tagline">TEZ • XAVFSIZ • SODDA</p>
        
        <div class="search-container">
            <input type="text" id="searchInput" class="search-box" 
                   placeholder="Nima qidiramiz?" autofocus>
        </div>

        <div class="currency-container" id="currencyBox">
            <div class="currency-item">
                <span class="currency-label">USD</span>
                <span class="currency-value" id="usd">...</span>
            </div>
            <div class="currency-item">
                <span class="currency-label">EUR</span>
                <span class="currency-value" id="eur">...</span>
            </div>
            <div class="currency-item">
                <span class="currency-label">RUB</span>
                <span class="currency-value" id="rub">...</span>
            </div>
        </div>
    </div>

    <script>
        // Qidiruv funksiyasi
        const input = document.getElementById('searchInput');
        input.addEventListener('keypress', (e) => {
            if (e.key === 'Enter' && input.value.trim()) {
                window.location.href = "https://orbicxs.com/search?q=" + encodeURIComponent(input.value.trim());
            }
        });

        // Valyuta kurslarini olish (Jonli)
        async function fetchCurrency() {
            try {
                const response = await fetch('https://cbu.uz/uz/arkhiv-kursov-valyut/json/');
                const data = await response.json();
                const rates = {
                    'USD': data.find(i => i.Ccy === 'USD').Rate,
                    'EUR': data.find(i => i.Ccy === 'EUR').Rate,
                    'RUB': data.find(i => i.Ccy === 'RUB').Rate
                };
                document.getElementById('usd').innerText = rates.USD + ' so\'m';
                document.getElementById('eur').innerText = rates.EUR + ' so\'m';
                document.getElementById('rub').innerText = rates.RUB + ' so\'m';
            } catch (err) {
                console.log("Valyuta yuklanmadi");
            }
        }
        fetchCurrency();
    </script>
</body>
</html>
